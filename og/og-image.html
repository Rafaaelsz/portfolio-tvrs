<!doctype html>
<!--
  Arte da imagem Open Graph (1200×630) na direção Eclipse.
  Gere o PNG com: npm run og:image  (scripts/build-og-image.mjs)
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..700&family=Onest:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #030304;
      }
      body {
        position: relative;
        isolation: isolate; /* as camadas com z-index negativo ficam acima do fundo */
        font-family: "Onest", system-ui, sans-serif;
        color: #f4f6f8;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-top: 92px;
      }
      .grid {
        position: absolute;
        inset: 0;
        z-index: -3;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 35%, #000 20%, transparent 75%);
      }
      .eclipse {
        position: absolute;
        left: 50%;
        top: 505px;
        z-index: -1;
        width: 2200px;
        aspect-ratio: 1;
        transform: translateX(-50%);
        border-radius: 50%;
        background: #020203;
        box-shadow:
          0 -2px 0 0 rgba(255, 255, 255, 0.85),
          0 -10px 40px 0 rgba(191, 227, 255, 0.55),
          0 -40px 140px 10px rgba(110, 180, 255, 0.28),
          0 -120px 280px 40px rgba(90, 160, 255, 0.12);
      }
      .flare {
        position: absolute;
        left: 50%;
        top: 505px;
        z-index: -1;
        width: 560px;
        height: 150px;
        transform: translate(-50%, -55%);
        background: radial-gradient(
          ellipse at center,
          rgba(255, 255, 255, 0.9),
          rgba(191, 227, 255, 0.35) 30%,
          transparent 68%
        );
        filter: blur(8px);
        mix-blend-mode: screen;
      }
      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 26px;
        font-weight: 500;
        color: #a7adb6;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 999px;
        padding: 10px 24px 10px 18px;
        background: rgba(255, 255, 255, 0.02);
      }
      .kicker b {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #9effc9;
        box-shadow: 0 0 12px #9effc9;
      }
      h1 {
        margin-top: 34px;
        font-family: "Archivo", system-ui, sans-serif;
        font-variation-settings: "wdth" 118;
        font-weight: 700;
        font-size: 118px;
        line-height: 0.92;
        letter-spacing: -0.045em;
        background: linear-gradient(180deg, #fff 0%, #fff 45%, rgba(255, 255, 255, 0.6) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 span {
        background: linear-gradient(100deg, #fff 10%, #bfe3ff 45%, #d9fff1 60%, #fff 85%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin-top: 30px;
        font-size: 25px;
        color: #a7adb6;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="eclipse"></div>
    <div class="flare"></div>
    <span class="kicker"><b></b>Rafael Tavares</span>
    <h1>Eu construo<br /><span>e coloco no ar.</span></h1>
    <p>Sistemas web · Landing pages · Automações</p>
  </body>
</html>
